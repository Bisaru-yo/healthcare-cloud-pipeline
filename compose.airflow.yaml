# Merge with compose.yaml; the existing source PostgreSQL service is retained.
services:
  airflow-meta:
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Run scripts/setup_airflow.py first}
    volumes:
      - airflow_meta:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: healthcare-airflow:3.3.2
    command: standalone
    working_dir: /opt/project
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-meta:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__PARALLELISM: '2'
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Run scripts/setup_airflow.py first}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: bishal:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /run/project/airflow_passwords.json
      PIPELINE_RUNTIME_CONFIG: /run/project/runtime.json
      PIPELINE_PROJECT_ROOT: /opt/project
      PIPELINE_PYTHON: /opt/pipeline-venv/bin/python
      AWS_PROFILE: healthcare-cloud
      AWS_REGION: us-east-2
    volumes:
      - .:/opt/project
      - airflow_home:/opt/airflow
      - type: bind
        source: ${AWS_HOME:?Run scripts/setup_airflow.py first}
        target: /home/airflow/.aws
      - type: bind
        source: ${SNOWFLAKE_KEY_FILE:?Run scripts/setup_airflow.py first}
        target: /run/project/snowflake_dbt_key.p8
        read_only: true
      - ./local/airflow_runtime.json:/run/project/runtime.json:ro
      - ./local/airflow_passwords.json:/run/project/airflow_passwords.json
    ports:
      - "127.0.0.1:${AIRFLOW_UI_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-meta:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 15s
      timeout: 15s
      start_period: 90s
      retries: 20
volumes:
  airflow_meta:
  airflow_home:
